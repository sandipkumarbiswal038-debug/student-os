<!DOCTYPE html>
<html>

<head>
    <title>Student Dashboard</title>
</head>

<body>

    <h1>Welcome, {{ student.name }}</h1>

    <p>Email: {{ student.college_email }}</p>
    <p>course: {{ student.course }}</p>

    <p>Registration no: {{ student.registration_no }}</p>

    <p>contact no: {{ student.contact_no }}</p>

    <a href="{% url 'logout' %}">
        Logout
    </a>

</body>

</html>
